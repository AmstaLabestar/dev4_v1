<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CV — Hamza Bikienga</title>
    <meta name="description" content="CV de Hamza Bikienga, ingénieur logiciel backend et DevOps." />
    <!-- Page utilitaire : elle ne doit pas concurrencer le portfolio dans l'index. -->
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/png" href="./favicon.png" />

    <style>
      /* Memes tokens que le portfolio, pour que le viewer suive le meme theme. */
      :root {
        --bg: #fbfcfd;
        --surface: #ffffff;
        --border: #e2e7ed;
        --border-strong: #c9d2dc;
        --fg: #0f1720;
        --fg-muted: #4a5563;
        color-scheme: light;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b0e14;
          --surface: #12161f;
          --border: #242b38;
          --border-strong: #333c4c;
          --fg: #e9eef6;
          --fg-muted: #a8b3c4;
          color-scheme: dark;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--fg);
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      }

      .shell {
        width: 100%;
        max-width: 1120px;
        margin-inline: auto;
        padding: 16px 20px 24px;
      }

      .topbar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 16px;
      }

      .title {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
      }

      .subtitle {
        margin: 4px 0 0;
        font-size: 0.8125rem;
        color: var(--fg-muted);
      }

      .actions {
        display: flex;
        gap: 8px;
      }

      .link {
        display: inline-flex;
        align-items: center;
        /* 44px : cible tactile accessible. */
        min-height: 44px;
        padding: 0 16px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: var(--surface);
        color: var(--fg-muted);
        font-size: 0.875rem;
        text-decoration: none;
      }

      .link:hover {
        border-color: var(--border-strong);
        color: var(--fg);
      }

      .link:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 2px;
      }

      .viewer {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--surface);
      }

      iframe {
        display: block;
        width: 100%;
        height: calc(100vh - 140px);
        min-height: 480px;
        border: 0;
      }

      /* Repli pour les navigateurs mobiles qui n'affichent pas un PDF en iframe. */
      .fallback {
        margin: 12px 0 0;
        font-size: 0.8125rem;
        color: var(--fg-muted);
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <h1 class="title">CV — Hamza Bikienga</h1>
          <p class="subtitle">Ingénieur logiciel — Backend &amp; DevOps</p>
        </div>
        <div class="actions">
          <a class="link" href="./">Retour au portfolio</a>
          <a class="link" href="./CV_Hamza_BIKIENGA.pdf" target="_blank" rel="noopener">
            Ouvrir le PDF
          </a>
        </div>
      </header>

      <section class="viewer" aria-label="Visualisation du CV">
        <iframe
          src="./CV_Hamza_BIKIENGA.pdf#toolbar=0&amp;navpanes=0&amp;scrollbar=1"
          title="CV de Hamza Bikienga au format PDF"
        ></iframe>
      </section>

      <p class="fallback">
        Le CV ne s'affiche pas ?
        <a href="./CV_Hamza_BIKIENGA.pdf" target="_blank" rel="noopener">Ouvrir le PDF directement</a>.
      </p>
    </main>
  </body>
</html>
